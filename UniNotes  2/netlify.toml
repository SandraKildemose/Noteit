[build]
  publish = "."

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Sørger for at service worker opdateres korrekt
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Statiske assets caches i 1 år
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML og JS genvalideres ved hvert besøg
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
